name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk cashlytix-${{ github.ref_name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: cashlytix-apk
          path: cashlytix-*.apk
      - name: Publish a release with the APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" cashlytix-*.apk --title "Cashlytix ${{ github.ref_name }}" --notes "Android test build. Install the APK on your phone (allow installs from this source)."
